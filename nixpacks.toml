# Railway（Nixpacksビルダー）向けの設定。
#
# このリポジトリは backend/（Django）と frontend/（React/Vite）が並んだ構成のため、
# Nixpacksの自動検出だけでは正しくビルドできない。そのためビルド手順を明示している。
#
# 本番は「1サービス構成」：Djangoが /api/ でAPIを、それ以外のパスで
# ビルド済みフロントエンド（frontend/dist）を配信する（backend/config/urls.py, spa.py 参照）。

[phases.setup]
nixPkgs = ["python311", "nodejs_20"]

[phases.install]
cmds = [
  "python -m pip install --upgrade pip",
  "pip install -r backend/requirements.txt",
  "cd frontend && npm ci",
]

[phases.build]
cmds = ["cd frontend && npm run build"]

[start]
cmd = "cd backend && python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2"
